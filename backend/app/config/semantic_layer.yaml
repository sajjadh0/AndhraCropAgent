dimensions:
  states:
    values:
      - name: Andhra Pradesh
        synonyms: [AP, andhra]
      - name: Karnataka
        synonyms: [karnataka, KA]
      - name: Madhya Pradesh
        synonyms: [MP, madhya pradesh]
      - name: Maharashtra
        synonyms: [MH, maharashtra, maha]
    default: Maharashtra

  price_types:
    values:
      - name: modal_price
        synonyms: [mandi price, wholesale price, modal, mandi]
      - name: retail_price
        synonyms: [retail, doca, consumer price]
    default: modal_price

join_keys:
  - tables: [onion_prices]
    keys: [date, state]

local_defaults:
  state: Maharashtra
