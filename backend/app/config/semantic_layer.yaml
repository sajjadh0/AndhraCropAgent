    description: "Onion mandi modal price in Andhra Pradesh"
    commodity: onion
    source_table: onion_prices
    value_column: modal_price
    date_column: date
    filters:
      state: Andhra Pradesh
    grain: daily
    unit: Rs/Qtl
    role: target_candidate
    
